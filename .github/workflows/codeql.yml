name: "Code Scanning - CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '21 17 * * 0'

jobs:
  codeql:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language:
          - javascript
          - actions
      fail-fast: false

    permissions:
      contents: read
      security-events: write
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@d8251b8572db9671915a70de606ed39bc2259c91 # main
        with:
            languages: ${{ matrix.language }}
            config-file: ./.github/codeql/codeql-config.yml
            tools: nightly

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@d8251b8572db9671915a70de606ed39bc2259c91 # main
